name: Weekly Anti-Regression

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace-freshness:
    name: workspace-freshness
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build frontend for preview server
        run: npm run build

      - name: Run all workspace canaries
        run: npm run test:canaries:browser

      - name: Run deterministic History replay ratchet
        run: npm run test:history-replay

      - name: Verify History create and replay flows
        run: npm run test:history-replay:browser

      - name: Generate History replay reports
        run: |
          npm run report:history-replay -- --output history-replay.txt
          npm run report:history-replay -- --json --output history-replay.json
          cat history-replay.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Generate workspace freshness reports
        run: |
          AS_OF="$(date -u +%F)"
          node tools/workspace-freshness.mjs --as-of "$AS_OF" > workspace-freshness.txt
          node tools/workspace-freshness.mjs --as-of "$AS_OF" --json > workspace-freshness.json
          cat workspace-freshness.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload workspace freshness reports
        uses: actions/upload-artifact@v7
        with:
          name: workspace-freshness-${{ github.run_id }}
          if-no-files-found: error
          path: |
            workspace-freshness.txt
            workspace-freshness.json
            history-replay.txt
            history-replay.json
